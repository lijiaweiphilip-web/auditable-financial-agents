name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .[dev]
      - name: Unit and integration tests
        run: python -m coverage run --source=src/auditable_financial_agents -m unittest discover -s tests -v
      - name: Coverage gate
        run: python -m coverage report --fail-under=97
      - name: Base install smoke
        run: |
          python -m venv .base-venv
          .base-venv/bin/python -m pip install --no-deps .
          .base-venv/bin/financial-agent-audit --help
      - name: Compile check
        run: python -m compileall -q src tests
      - name: Ruff check
        run: ruff check src tests
      - name: Public demo
        run: financial-agent-audit demo --examples examples
      - name: Validate public case
        run: financial-agent-audit validate-case examples/clean_case.json
      - name: Validate schemas and paper map
        run: python -m unittest tests.test_paper_code_map -v
