[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auditable-financial-agents"
version = "0.2.0"
description = "Public-safe research-label certificates for financial artifacts produced by tool-using AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jiawei Li"}]
keywords = ["financial-ai", "ai-agents", "model-evaluation", "human-ai", "auditability"]

[project.scripts]
financial-agent-audit = "auditable_financial_agents.cli:main"

[project.optional-dependencies]
dev = [
  "coverage>=7.0,<8",
  "ruff>=0.5,<1",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["src"]
